<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terra Aventura Radar</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <header class="plaque">
      <svg class="plaque__compass" viewBox="0 0 40 40" aria-hidden="true">
        <circle
          cx="20"
          cy="20"
          r="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path d="M20 4 L23 20 L20 36 L17 20 Z" fill="currentColor" />
        <path
          d="M4 20 L20 17 L36 20 L20 23 Z"
          fill="currentColor"
          opacity="0.5"
        />
      </svg>
      <div>
        <h1 class="plaque__title">Terra Aventura Radar</h1>
        <p class="plaque__tagline">Chassez le trésor sur votre route</p>
      </div>
    </header>

    <form class="route-card" id="route-form">
      <div class="route-card__field">
        <label for="depart">Départ</label>
        <input
          type="text"
          id="depart"
          name="depart"
          placeholder="Ville de départ"
          autocomplete="off"
          required
        />
      </div>
      <div class="route-card__field">
        <label for="arrivee">Arrivée</label>
        <input
          type="text"
          id="arrivee"
          name="arrivee"
          placeholder="Ville d'arrivée"
          autocomplete="off"
          required
        />
      </div>
      <div class="route-card__field">
        <span class="route-card__radius-label">Véhicule</span>
        <div
          class="route-card__radius-group"
          role="group"
          aria-label="Véhicule"
        >
          <button
            type="button"
            class="route-card__radius-btn is-active"
            data-vehicule="car"
            aria-pressed="true"
          >
            🚗 Voiture
          </button>
          <button
            type="button"
            class="route-card__radius-btn"
            data-vehicule="bike"
            aria-pressed="false"
          >
            🚲 Vélo
          </button>
        </div>
      </div>
      <div class="route-card__field">
        <span class="route-card__radius-label">Rayon de recherche</span>
        <div
          class="route-card__radius-group"
          role="group"
          aria-label="Rayon de recherche"
        >
          <button type="button" class="route-card__radius-btn" data-rayon="5">
            5 km
          </button>
          <button
            type="button"
            class="route-card__radius-btn is-active"
            data-rayon="10"
            aria-pressed="true"
          >
            10 km
          </button>
          <button type="button" class="route-card__radius-btn" data-rayon="20">
            20 km
          </button>
        </div>
      </div>
      <p class="route-card__error" id="route-error" role="alert" hidden></p>
      <button
        type="submit"
        class="route-card__submit"
        id="route-submit"
        aria-label="Tracer l'itinéraire"
      >
        <span class="route-card__submit-icon" aria-hidden="true">&rarr;</span>
      </button>
    </form>

    <footer class="credit">
      © 2026 · Mickaël Blondeau .
      <a
        href="https://github.com/mickablondo/terra-aventura-radar"
        target="_blank"
        rel="noopener"
        >Code source sur GitHub</a
      >
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
